# Parameters explicitly listed in Tables I-II of Inoue et al., PRB 99, 035308 (2019).
optical:
  lattice_constant_nm: 277.0
  wavelength_nm: 950.65
  group_index: 3.513
  effective_index: 3.429
  active_index: 3.584
  internal_loss_cm: 5.0
  confinement_factor: 0.044
  dn_dN_cm3: -5.0e-21
  # Calibrated A/B/C/D values. The paper does not publish its reconstructed 4x4 C matrix.
  modal_detuning_cm: [0.0, 260.0, 720.0, 880.0]
  modal_radiation_loss_cm: [2.5, 8.0, 28.0, 32.0]
  carrier_index_change: true
  temporal_index_term: true

carrier:
  maximum_gain_cm: 2000.0
  zero_carrier_gain_cm: -5000.0
  transparency_density_cm3: 1.5e18
  lifetime_ns: 1.5
  diffusion_cm2_s: 100.0
  active_thickness_nm: 30.0
  spontaneous_emission_factor: 1.0e-4

device:
  # The 300-um electrode is embedded in a wider numerical window so current spreading is resolved.
  domain_um: 400.0
  electrode_um: 300.0
  current_spread_um: 25.0
  threshold_current_A: 0.7

numerics:
  points: 41
  end_time_ns: 10.0
  cfl: 0.8
  sample_interval_ps: 5.0
  snapshot_interval_ps: 100.0
  seed: 19
  carrier_substeps: 1
  noise: true

reproduction:
  current_ratios: [1.05, 1.4, 2.8, 4.2]
  spectrum_window_ns: 4.0

